<!-- Экран логина -->
<div id="login-screen">
  <input type="text" id="teamCode" placeholder="Введите код команды">
  <button onclick="login()">Войти</button>
</div>

<!-- Экран игры (скрыт до входа) -->
<div id="game" style="display: none;">
  <!-- Основная информация всегда видна -->
  <div id="main-info" style="position: sticky; top: 0; background: #f0f0f0; padding: 10px; z-index: 10; border-bottom: 1px solid #ccc;">
    <span>Команда: <b id="teamCodeDisplay"></b></span> |
    <span>Поездок: <b id="tripsLeft">0</b></span>
    <br>
    <input type="text" id="addressInput" placeholder="Введите адрес">
    <button onclick="goTrip()">Поехать</button>
  </div>

  <!-- История поездок с прокруткой -->
  <div id="history-box" style="height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; margin-top: 10px; background: #fff;">
    <ul id="tripsHistory" style="margin: 0; padding-left: 20px; list-style: decimal;"></ul>
  </div>
</div>
