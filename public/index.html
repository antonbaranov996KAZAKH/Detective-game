<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра поездки с админом</title>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f8f8f8; }

/* Логин */
#login-screen {
  display: flex; flex-direction: column; align-items:center; justify-content:center; height:100vh; padding:20px;
}
#login-screen input, #login-screen button {
  width:100%; max-width:400px; margin-bottom:10px; padding:10px; font-size:16px; border-radius:5px; box-sizing:border-box;
}
#login-screen button { background:#4CAF50; color:#fff; border:none; cursor:pointer; }
#login-screen button:hover { background:#45a049; }

/* Игровой экран */
#game { display:none; width:95%; max-width:500px; margin:0 auto; padding:10px; }
#main-info { position: sticky; top:0; background:#fff; padding:10px; border-bottom:1px solid #ccc; z-index:10; display:flex; flex-direction:column; gap:5px; }
#main-info span { font-weight:bold; }
#main-info input, #main-info button { width:100%; padding:10px; font-size:16px; border-radius:5px; box-sizing:border-box; }
#main-info button { cursor:pointer; background:#4CAF50; color:#fff; border:none; }
#main-info button:hover { background:#45a049; }
#history-box { height: calc(100vh - 130px); overflow-y:auto; padding:10px; margin-top:10px; border:1px solid #ccc; background:#fff; white-space:pre-wrap; }
#tripsHistory { margin:0; padding-left:20px; list-style: decimal; }

/* Анимация счетчика */
@keyframes jump {0%{transform:scale(1);color:#000;}30%{transform:scale(1.5);color:#4CAF50;}60%{transform:scale(1.2);color:#000;}100%{transform:scale(1);color:#000;}}
.jump { animation: jump 0.5s ease; }

/* Админский экран */
#admin-screen { display:none; width:95%; max-width:600px; margin:0 auto; padding:10px; }
#admin-screen h2 { text-align:center; }
#admin-screen table { width:100%; border-collapse:collapse; }
#admin-screen th, #admin-screen td { border:1px solid #ccc; padding:5px; text-align:left; }
#admin-screen th { background:#eee; }
#admin-screen button { margin-top:10px; padding:10px; font-size:16px; border-radius:5px; cursor:pointer; background:#f44336; color:#fff; border:none; }
#admin-screen button:hover { background:#d32f2f; }

#admin-controls { display:flex; gap:10px; margin-bottom:10px; }
#admin-controls button { flex:1; background:#2196F3; }
#admin-controls button:hover { background:#1976D2; }
</style>
</head>
<body>

<!-- Логин -->
<div id="login-screen">
  <input type="text" id="teamCode" placeholder="Введите код команды">
  <input type="password" id="adminPass" placeholder="Пароль админа (если админ)">
  <button onclick="login()">Войти</button>
</div>

<!-- Игровой экран -->
<div id="game">
  <div id="main-info">
    <span>Команда: <b id="teamCodeDisplay"></b></span>
    <span>Поездок: <b id="tripsLeft">0</b></span>
    <span>Таймер: <b id="timer">Остановлен</b></span>
    <input type="text" id="addressInput" placeholder="Введите адрес">
    <button onclick="goTrip()">Поехать</button>
  </div>

  <div id="history-box">
    <ul id="tripsHistory"></ul>
  </div>
</div>

<!-- Админский экран -->
<div id="admin-screen">
  <h2>Админский панель</h2>
  <div id="admin-controls">
    <button onclick="startGame(30)">Старт 30 мин</button>
    <button onclick="startGame(45)">Старт 45 мин</button>
    <button onclick="stopGame()">Остановить</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Команда</th>
        <th>Время</th>
        <th>Адрес</th>
        <th>Инфо</th>
      </tr>
    </thead>
    <tbody id="adminHistory"></tbody>
  </table>
  <button onclick="resetAllData()">Сбросить данные</button>
</div>

<script>
// Глобальные переменные
let teamCode = '';
let isAdmin = false;
let updateInterval = null;
let timerInterval = null;

// ================ ЛОГИН ================
async function login() {
  const teamInput = document.getElementById('teamCode').value.trim();
  const adminPass = document.getElementById('adminPass').value.trim();
  
  if (!teamInput && !adminPass) {
    alert('Введите код команды или пароль админа');
    return;
  }
  
  // Проверка на админа
  if (adminPass === 'admin123') {
    isAdmin = true;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    startAdminAutoUpdate();
    return;
  }
  
  // Обычная команда
  if (!teamInput) {
    alert('Введите код команды');
    return;
  }
  
  teamCode = teamInput;
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ teamCode })
    });
    
    const data = await res.json();
    
    if (data.success) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      document.getElementById('teamCodeDisplay').textContent = teamCode;
      
      // Загружаем историю поездок
      updateTripsHistory(data.tripsHistory || []);
      
      // Запускаем обновление статуса
      startStatusUpdates();
    } else {
      alert('Ошибка входа');
    }
  } catch (error) {
    alert('Ошибка соединения с сервером');
  }
}

// ================ ИГРОВЫЕ ФУНКЦИИ ================
async function goTrip() {
  const address = document.getElementById('addressInput').value.trim();
  
  if (!address) {
    alert('Введите адрес');
    return;
  }
  
  try {
    const res = await fetch('/api/trip', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ teamCode, address })
    });
    
    const data = await res.json();
    
    if (data.success) {
      // Очищаем поле ввода
      document.getElementById('addressInput').value = '';
      
      // Обновляем историю
      updateTripsHistory(data.tripsHistory || []);
      
      // Анимация счетчика
      const tripsLeft = document.getElementById('tripsLeft');
      tripsLeft.classList.add('jump');
      setTimeout(() => tripsLeft.classList.remove('jump'), 500);
      
      // Показываем результат
      alert(data.info);
    } else {
      alert(data.info || 'Ошибка при поездке');
    }
  } catch (error) {
    alert('Ошибка соединения с сервером');
  }
}

function updateTripsHistory(trips) {
  const list = document.getElementById('tripsHistory');
  list.innerHTML = '';
  
  // Показываем последние 20 поездок
  trips.slice(-20).reverse().forEach(trip => {
    const li = document.createElement('li');
    li.textContent = `${trip.time} - ${trip.address} (${trip.info})`;
    list.appendChild(li);
  });
  
  document.getElementById('tripsLeft').textContent = trips.length;
}

// ================ СТАТУС ИГРЫ ================
function startStatusUpdates() {
  // Обновляем статус каждую секунду
  if (timerInterval) clearInterval(timerInterval);
  
  updateStatus();
  timerInterval = setInterval(updateStatus, 1000);
}

async function updateStatus() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    
    const timerElement = document.getElementById('timer');
    
    if (data.isRunning && data.remaining > 0) {
      const minutes = Math.floor(data.remaining / 60000);
      const seconds = Math.floor((data.remaining % 60000) / 1000);
      timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    } else {
      timerElement.textContent = 'Остановлен';
    }
  } catch (error) {
    console.error('Ошибка получения статуса:', error);
  }
}

// ================ АДМИНСКИЕ ФУНКЦИИ ================
function startAdminAutoUpdate() {
  fetchAdminHistory();
  if (updateInterval) clearInterval(updateInterval);
  updateInterval = setInterval(fetchAdminHistory, 2000);
}

async function fetchAdminHistory() {
  try {
    const res = await fetch('/api/admin/history');
    const data = await res.json();
    updateAdminTable(data.allTrips || []);
  } catch (error) {
    console.error('Ошибка загрузки истории:', error);
  }
}

function updateAdminTable(trips) {
  const tbody = document.getElementById('adminHistory');
  tbody.innerHTML = '';
  
  // Сортируем по времени (новые сверху)
  trips.sort((a, b) => new Date(b.time) - new Date(a.time));
  
  trips.forEach(trip => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${trip.team}</td>
      <td>${trip.time}</td>
      <td>${trip.address}</td>
      <td>${trip.info}</td>
    `;
    tbody.appendChild(tr);
  });
}

async function startGame(minutes) {
  try {
    const res = await fetch('/api/admin/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ 
        minutes,
        password: 'admin123' // В реальном проекте брать из переменной
      })
    });
    
    const data = await res.json();
    alert(data.message || 'Игра запущена');
  } catch (error) {
    alert('Ошибка запуска игры');
  }
}

async function stopGame() {
  try {
    const res = await fetch('/api/admin/stop', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password: 'admin123' })
    });
    
    const data = await res.json();
    alert(data.message || 'Игра остановлена');
  } catch (error) {
    alert('Ошибка остановки игры');
  }
}

async function resetAllData() {
  if (!confirm('Вы уверены, что хотите сбросить ВСЕ данные?')) return;
  
  try {
    const res = await fetch('/api/admin/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ password: 'admin123' })
    });
    
    const data = await res.json();
    if (data.success) {
      alert('Все данные сброшены');
      fetchAdminHistory(); // Обновляем таблицу
    } else {
      alert('Ошибка сброса данных');
    }
  } catch (error) {
    alert('Ошибка соединения с сервером');
  }
}

// Очистка интервалов при уходе со страницы
window.addEventListener('beforeunload', function() {
  if (timerInterval) clearInterval(timerInterval);
  if (updateInterval) clearInterval(updateInterval);
});
</script>
</body>
</html>
