<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра поездки с админом</title>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f8f8f8; }

/* Логин */
#login-screen {
  display: flex; flex-direction: column; align-items:center; justify-content:center; height:100vh; padding:20px;
}
#login-screen input, #login-screen button {
  width:100%; max-width:400px; margin-bottom:10px; padding:10px; font-size:16px; border-radius:5px; box-sizing:border-box;
}
#login-screen button { background:#4CAF50; color:#fff; border:none; cursor:pointer; }
#login-screen button:hover { background:#45a049; }

/* Игровой экран */
#game { display:none; width:95%; max-width:500px; margin:0 auto; padding:10px; }
#main-info { position: sticky; top:0; background:#fff; padding:10px; border-bottom:1px solid #ccc; z-index:10; display:flex; flex-direction:column; gap:5px; }
#main-info span { font-weight:bold; }
#main-info input, #main-info button { width:100%; padding:10px; font-size:16px; border-radius:5px; box-sizing:border-box; }
#main-info button { cursor:pointer; background:#4CAF50; color:#fff; border:none; }
#main-info button:hover { background:#45a049; }
#history-box { height: calc(100vh - 130px); overflow-y:auto; padding:10px; margin-top:10px; border:1px solid #ccc; background:#fff; white-space:pre-wrap; }
#tripsHistory { margin:0; padding-left:20px; list-style: decimal; }

/* Анимация счетчика */
@keyframes jump {0%{transform:scale(1);color:#000;}30%{transform:scale(1.5);color:#4CAF50;}60%{transform:scale(1.2);color:#000;}100%{transform:scale(1);color:#000;}}
.jump { animation: jump 0.5s ease; }

/* Админский экран */
#admin-screen { display:none; width:95%; max-width:600px; margin:0 auto; padding:10px; }
#admin-screen h2 { text-align:center; }
#admin-screen table { width:100%; border-collapse:collapse; }
#admin-screen th, #admin-screen td { border:1px solid #ccc; padding:5px; text-align:left; }
#admin-screen th { background:#eee; }
#admin-screen button { margin-top:10px; padding:10px; font-size:16px; border-radius:5px; cursor:pointer; background:#f44336; color:#fff; border:none; }
#admin-screen button:hover { background:#d32f2f; }

#admin-controls { display:flex; gap:10px; margin-bottom:10px; }
#admin-controls button { flex:1; background:#2196F3; }
#admin-controls button:hover { background:#1976D2; }
</style>
</head>
<body>

<!-- Логин -->
<div id="login-screen">
  <input type="text" id="teamCode" placeholder="Введите код команды">
  <input type="password" id="adminPass" placeholder="Пароль админа (если админ)">
  <button onclick="login()">Войти</button>
</div>

<!-- Игровой экран -->
<div id="game">
  <div id="main-info">
    <span>Команда: <b id="teamCodeDisplay"></b></span>
    <span>Поездок: <b id="tripsLeft">0</b></span>
    <span>Таймер: <b id="timer">Остановлен</b></span>
    <input type="text" id="addressInput" placeholder="Введите адрес">
    <button onclick="goTrip()">Поехать</button>
  </div>

  <div id="history-box">
    <ul id="tripsHistory"></ul>
  </div>
</div>

<!-- Админский экран -->
<div id="admin-screen">
  <h2>Админский панель</h2>
  <div id="admin-controls">
    <button onclick="startGame(30)">Старт 30 мин</button>
    <button onclick="startGame(45)">Старт 45 мин</button>
    <button onclick="stopGame()">Остановить</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>Команда</th>
        <th>Время</th>
        <th>Адрес</th>
        <th>Инфо</th>
      </tr>
    </thead>
    <tbody id="adminHistory"></tbody>
  </table>
  <button onclick="resetAllData()">Сбросить данные</button>
</div>

<script>
// ================= GLOBAL =================
let isGameRunning = false;
let endTime = null;
let teamCode = '';
let tripCounter = 0;
const ADMIN_PASSWORD = 'admin123';

// ---------------- LOGIN ----------------
function login() {
  const code = document.getElementById('teamCode').value.trim();
  const pass = document.getElementById('adminPass').value.trim();

  if (pass === ADMIN_PASSWORD) {
    fetch('/api/admin/history')
      .then(res => res.json())
      .then(data => {
        updateAdminTable(data.allTrips);
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-screen').style.display = 'block';
      })
      .catch(err => alert('Ошибка связи с сервером'));
  } else {
    if (!code) return alert('Введите код команды');
    teamCode = code;
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teamCode })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.success) return alert('Ошибка входа');
      tripCounter = data.tripsHistory.length;
      document.getElementById('tripsLeft').textContent = tripCounter;
      document.getElementById('teamCodeDisplay').textContent = teamCode;
      updateHistory(data.tripsHistory);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('game').style.display = 'block';
    })
    .catch(err => alert('Ошибка связи с сервером'));
  }
}

// ---------------- TIMER ----------------
function updateTimer() {
  if (!isGameRunning || !endTime) {
    document.getElementById('timer').textContent = "Остановлен";
    return;
  }
  const diff = endTime - Date.now();
  if (diff <= 0) {
    isGameRunning = false;
    document.getElementById('timer').textContent = "00:00";
    return;
  }
  const minutes = Math.floor(diff / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);
  document.getElementById('timer').textContent = `${minutes}:${seconds.toString().padStart(2,'0')}`;
}

function fetchGameStatus() {
  fetch('/api/status')
    .then(res => res.json())
    .then(data => { isGameRunning = data.isRunning; endTime = data.endTime; })
    .catch(err => console.warn('Не удалось получить статус игры'));
}

// ---------------- TRIP ----------------
function goTrip() {
  if (!isGameRunning) return alert('Игра ещё не началась!');
  const address = document.getElementById('addressInput').value.trim();
  if (!address) return alert('Введите адрес');
  if (!confirm('Вы действительно хотите совершить поездку?')) return;
  fetch('/api/trip', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({teamCode,address})
  })
  .then(res => res.json())
  .then(data => {
    if (!data.success) return alert(data.info);
    tripCounter++;
    const tripsEl = document.getElementById('tripsLeft');
    tripsEl.textContent = tripCounter;
    tripsEl.classList.remove('jump');
    void tripsEl.offsetWidth;
    tripsEl.classList.add('jump');
    updateHistory(data.tripsHistory);
    alert(data.info);
  })
  .catch(err => alert('Ошибка связи с сервером'));
}

function updateHistory(history) {
  const ul = document.getElementById('tripsHistory');
  ul.innerHTML = '';
  history.forEach(h => {
    const li = document.createElement('li');
    li.textContent = `${h.time} — ${h.address} → ${h.info}`;
    ul.appendChild(li);
  });
}

// ---------------- ADMIN ----------------
function startGame(minutes) {
  fetch('/api/admin/start',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({minutes,password:ADMIN_PASSWORD})
  }).then(res=>res.json()).then(data=>alert(data.message)).catch(()=>alert('Ошибка связи с сервером'));
}

function stopGame() {
  fetch('/api/admin/stop',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:ADMIN_PASSWORD})
  }).then(res=>res.json()).then(data=>alert(data.message)).catch(()=>alert('Ошибка связи с сервером'));
}

function resetAllData() {
  if(!confirm('Вы точно хотите сбросить все данные?')) return;
  fetch('/api/admin/reset',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:ADMIN_PASSWORD})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.success){ alert('Данные сброшены'); document.getElementById('adminHistory').innerHTML='';}
    else alert('Ошибка сброса');
  }).catch(()=>alert('Ошибка связи с сервером'));
}

function updateAdminTable(allTrips) {
  const tbody = document.getElementById('adminHistory');
  tbody.innerHTML='';
  allTrips.forEach(trip=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${trip.team}</td><td>${trip.time}</td><td>${trip.address}</td><td>${trip.info}</td>`;
    tbody.appendChild(tr);
  });
}

// ---------------- AUTO UPDATE ----------------
setInterval(()=>{
  fetchGameStatus();
  updateTimer();
  if(document.getElementById('admin-screen').style.display==='block'){
    fetch('/api/admin/history')
      .then(res=>res.json())
      .then(data=>updateAdminTable(data.allTrips))
      .catch(()=>console.warn('Не удалось обновить админку'));
  }
},1000);
</script>
</body>
</html>
