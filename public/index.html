<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детективная игра</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Уведомления -->
<div id="notification" class="notification" style="display:none;"></div>

<!-- Логин -->
<div id="login-screen">
  <h1>🔍 Детективная игра</h1>
  <input type="text" id="teamCode" placeholder="Введите код команды">
  <input type="password" id="adminPass" placeholder="Пароль админа (если админ)">
  <button onclick="login()">Войти</button>
</div>

<!-- Игровой экран -->
<div id="game">
  <div id="main-info">
    <span>Команда: <b id="teamCodeDisplay"></b></span>
    <span>Поездок: <b id="tripsLeft">0</b></span>
    <span>Таймер: <b id="timer">⏸️ Остановлен</b></span>
    <input type="text" id="addressInput" placeholder="Введите адрес" onkeypress="if(event.key==='Enter') goTrip()">
    <button onclick="goTrip()">🚗 Поехать</button>
    <button onclick="logout()" style="background:#f44336;">🚪 Выйти</button>
  </div>

  <div id="history-box">
    <h3>📜 История поездок:</h3>
    <ul id="tripsHistory"></ul>
  </div>
</div>

<!-- Админский экран -->
<div id="admin-screen">
  <h2>🔐 Админская панель</h2>
  <div id="admin-controls">
    <button onclick="startGame(30)">▶️ Старт 30 мин</button>
    <button onclick="startGame(45)">▶️ Старт 45 мин</button>
    <button onclick="stopGame()">⏹️ Стоп</button>
    <button onclick="logout()" style="background:#f44336;">🚪 Выйти</button>
  </div>
  
  <h3>📊 Все поездки:</h3>
  <table>
    <thead>
      <tr>
        <th>Команда</th>
        <th>Время</th>
        <th>Адрес</th>
        <th>Информация</th>
      </tr>
    </thead>
    <tbody id="adminHistory"></tbody>
  </table>
  
  <button onclick="resetAllData()" style="background:#f44336;">⚠️ Сбросить все данные</button>
</div>

<script src="game.js"></script>
</body>
</html>
