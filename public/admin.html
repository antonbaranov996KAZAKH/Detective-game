<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка игры</title>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }

/* Логин */
#login-screen {
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  height:100vh; padding:20px;
}
#login-screen input, #login-screen button {
  width:100%; max-width:400px; margin-bottom:10px; padding:10px; font-size:16px;
}
#login-screen button { background:#4CAF50; color:#fff; border:none; }

/* Админ */
#admin-screen { display:none; padding:10px; }

#admin-controls {
  display:flex; gap:10px; margin-bottom:10px;
}
#admin-controls button {
  flex:1; padding:10px; font-size:16px; cursor:pointer;
  background:#2196F3; color:#fff; border:none;
}
#admin-controls button:hover { background:#1976D2; }

table { width:100%; border-collapse:collapse; background:#fff; }
th, td { border:1px solid #ccc; padding:6px; text-align:left; }
th { background:#eee; }

#resetBtn {
  margin-top:10px; width:100%; padding:10px;
  background:#f44336; color:#fff; border:none; cursor:pointer;
}
#resetBtn:hover { background:#d32f2f; }
</style>
</head>

<body>

<!-- ЛОГИН -->
<div id="login-screen">
  <input type="password" id="adminPass" placeholder="Пароль админа">
  <button onclick="login()">Войти</button>
</div>

<!-- АДМИНКА -->
<div id="admin-screen">
  <h2>Админ панель</h2>

  <div id="admin-controls">
    <button onclick="startGame(30)">Старт 30 мин</button>
    <button onclick="startGame(45)">Старт 45 мин</button>
    <button onclick="stopGame()">Стоп</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Команда</th>
        <th>Время</th>
        <th>Адрес</th>
        <th>Инфо</th>
      </tr>
    </thead>
    <tbody id="adminHistory"></tbody>
  </table>

  <button id="resetBtn" onclick="resetAllData()">Сбросить всё</button>
</div>

<script>

// ================= LOGIN =================
function login() {
  const pass = document.getElementById('adminPass').value;

  if (pass !== 'admin123') {
    alert('Неверный пароль');
    return;
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';

  startAutoUpdate();
}

// ================= API =================
async function fetchAdminData() {
  try {
    const res = await fetch('/api/admin/data');
    const data = await res.json();

    updateTable(data.allTrips);

  } catch (e) {
    console.error(e);
  }
}

// ================= TABLE =================
function updateTable(trips) {
  const tbody = document.getElementById('adminHistory');
  tbody.innerHTML = '';

  trips.reverse().forEach(t => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${t.team}</td>
      <td>${t.time}</td>
      <td>${t.address}</td>
      <td>${t.info}</td>
    `;

    tbody.appendChild(tr);
  });
}

// ================= AUTO =================
function startAutoUpdate() {
  fetchAdminData();
  setInterval(fetchAdminData, 2000);
}

// ================= CONTROL =================
async function startGame(minutes) {
  const res = await fetch('/api/admin/start', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ minutes })
  });

  const data = await res.json();
  alert(data.message);
}

async function stopGame() {
  const res = await fetch('/api/admin/stop', { method:'POST' });
  const data = await res.json();
  alert(data.message);
}

async function resetAllData() {
  if (!confirm('Удалить ВСЕ данные?')) return;

  const res = await fetch('/api/admin/reset', { method:'POST' });
  const data = await res.json();

  alert(data.message);
}

</script>

</body>
</html>
