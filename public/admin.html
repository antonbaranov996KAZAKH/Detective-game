<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка - Детективная игра</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #1a1a2e; color: #fff; }
    table { background: #16213e; color: #fff; }
    th { background: #0f3460; color: #fff; }
    td { border-color: #0f3460; }
    button { background: #e94560; }
    button:hover { background: #d43f5e; }
  </style>
</head>
<body>

<div id="admin-login">
  <h2>🔐 Вход для администратора</h2>
  <input type="password" id="adminPass" placeholder="Пароль админа">
  <button onclick="adminLogin()">Войти</button>
</div>

<div id="admin-panel" style="display:none;">
  <h2>📊 Панель управления</h2>
  
  <div id="admin-controls">
    <button onclick="startGame(30)">▶️ 30 минут</button>
    <button onclick="startGame(45)">▶️ 45 минут</button>
    <button onclick="startGame(60)">▶️ 60 минут</button>
    <button onclick="stopGame()">⏹️ Стоп</button>
  </div>
  
  <div id="game-stats">
    <h3>📈 Статистика:</h3>
    <p>Команд: <span id="statsTeams">0</span></p>
    <p>Всего поездок: <span id="statsTrips">0</span></p>
    <p>Статус: <span id="statsStatus">⏸️ Остановлена</span></p>
  </div>
  
  <h3>📋 История всех поездок:</h3>
  <table>
    <thead>
      <tr>
        <th>Команда</th>
        <th>Время</th>
        <th>Адрес</th>
        <th>Информация</th>
      </tr>
    </thead>
    <tbody id="adminHistory"></tbody>
  </table>
  
  <button onclick="resetAllData()" style="background:#f44336;">⚠️ Сбросить все данные</button>
  <button onclick="adminLogout()">🚪 Выйти</button>
</div>

<script>
const ADMIN_PASSWORD = 'admin123';

function adminLogin() {
  const pass = document.getElementById('adminPass').value;
  if (pass !== ADMIN_PASSWORD) {
    alert('Неверный пароль');
    return;
  }
  
  document.getElementById('admin-login').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  
  loadAdminData();
  setInterval(loadAdminData, 2000);
}

function adminLogout() {
  document.getElementById('admin-login').style.display = 'block';
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('adminPass').value = '';
}

function loadAdminData() {
  fetch('/api/admin/history')
    .then(res => res.json())
    .then(data => {
      updateAdminTable(data.allTrips);
      updateStats(data.allTrips);
    })
    .catch(err => console.error('Ошибка загрузки:', err));
    
  fetch('/api/status')
    .then(res => res.json())
    .then(data => {
      const statusEl = document.getElementById('statsStatus');
      if (data.isRunning) {
        const remaining = Math.floor(data.remaining / 60000);
        statusEl.textContent = `▶️ Идет (осталось ${remaining} мин)`;
      } else {
        statusEl.textContent = '⏸️ Остановлена';
      }
    });
}

function updateStats(trips) {
  const teams = new Set(trips.map(t => t.team));
  document.getElementById('statsTeams').textContent = teams.size;
  document.getElementById('statsTrips').textContent = trips.length;
}

function updateAdminTable(allTrips) {
  const tbody = document.getElementById('adminHistory');
  tbody.innerHTML = '';
  
  allTrips.slice(0, 100).forEach(trip => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${trip.team}</td><td>${trip.time}</td><td>${trip.address}</td><td>${trip.info}</td>`;
    tbody.appendChild(tr);
  });
}

function startGame(minutes) {
  fetch('/api/admin/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({minutes, password: ADMIN_PASSWORD})
  })
  .then(res => res.json())
  .then(data => alert(data.message));
}

function stopGame() {
  fetch('/api/admin/stop', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: ADMIN_PASSWORD})
  })
  .then(res => res.json())
  .then(data => alert(data.message));
}

function resetAllData() {
  if (!confirm('Вы уверены? Все данные будут удалены!')) return;
  
  fetch('/api/admin/reset', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: ADMIN_PASSWORD})
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    loadAdminData();
  });
}
</script>
</body>
</html>
